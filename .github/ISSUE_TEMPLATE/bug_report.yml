name: Rapport de bug
description: Signaler un comportement incorrect
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Que se passe-t-il ?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Étapes pour reproduire
      description: Trame reçue, commande lancée, code minimal…
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Comportement attendu
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environnement
      placeholder: "OS, version de Rust (rustc --version)"
